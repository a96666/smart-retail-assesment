name: Smart Retail Assistant - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME:    smartretailacr
  IMAGE_NAME:  smart-retail-assistant
  APP_NAME:    smart-retail-assistant
  RG:          rg-smart-retail

jobs:
  # ── 1. Test ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (trains models + builds RAG)
        run: python pipeline/run_pipeline.py
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/retail_test.db

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/retail_test.db
          APP_ENV: test
          LOG_LEVEL: WARNING

  # ── 2. Build & Push Docker image ──────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to Azure Container Apps ─────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup:        ${{ env.RG }}
          containerAppName:     ${{ env.APP_NAME }}
          imageToDeploy:        ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          environmentVariables: >
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}
            AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_DEPLOYMENT=gpt-4o
            AZURE_OPENAI_API_VERSION=2024-02-01
            AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-ada-002
            AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }}
            AZURE_SEARCH_API_KEY=${{ secrets.AZURE_SEARCH_API_KEY }}
            AZURE_SEARCH_INDEX_NAME=retail-knowledge-base
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_BLOB_CONTAINER=smart-retail-ai
            APP_ENV=production
            LOG_LEVEL=INFO
