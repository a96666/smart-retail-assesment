name: Smart Retail Assistant - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME:    smartretailacr
  IMAGE_NAME:  smart-retail-assistant
  APP_NAME:    smart-retail-assistant
  RG:          rg-smart-retail

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 – Run Tests
  # Runs on every push / PR. No secrets required.
  # ────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (trains models + builds RAG)
        run: python pipeline/run_pipeline.py
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/retail_test.db

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/retail_test.db
          APP_ENV: test
          LOG_LEVEL: WARNING

  # ────────────────────────────────────────────────────────────────
  # JOB 2 – Build & Push Docker image to ACR
  # Only runs on main branch pushes (not PRs).
  # Skips gracefully if ACR_USERNAME secret is not configured yet.
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    # Only run on direct pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      acr_configured: ${{ steps.check.outputs.configured }}

    steps:
      - uses: actions/checkout@v4

      - name: Check if ACR secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.ACR_USERNAME }}" ] && [ -n "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "ACR secrets found – will build and push image"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ACR secrets not configured – skipping Docker build"
            echo "To enable: add ACR_USERNAME and ACR_PASSWORD in repo Settings > Secrets"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        if: steps.check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        if: steps.check.outputs.configured == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────
  # JOB 3 – Deploy to Azure Container Apps
  # Only runs when build job ran AND Azure credentials are configured.
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check if Azure credentials are configured
        id: check
        run: |
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Azure credentials found – will deploy"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "AZURE_CREDENTIALS secret not configured – skipping deploy"
            echo "To enable: add AZURE_CREDENTIALS in repo Settings > Secrets"
          fi

      - name: Azure Login
        if: steps.check.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: steps.check.outputs.configured == 'true'
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup:        ${{ env.RG }}
          containerAppName:     ${{ env.APP_NAME }}
          imageToDeploy:        ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          environmentVariables: >
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}
            AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_DEPLOYMENT=gpt-4o
            AZURE_OPENAI_API_VERSION=2024-02-01
            AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-ada-002
            AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }}
            AZURE_SEARCH_API_KEY=${{ secrets.AZURE_SEARCH_API_KEY }}
            AZURE_SEARCH_INDEX_NAME=retail-knowledge-base
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_BLOB_CONTAINER=smart-retail-ai
            APP_ENV=production
            LOG_LEVEL=INFO
